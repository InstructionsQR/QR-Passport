# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ========== НОВОЕ: подставляем текущую дату в обложки ==========
      - name: Inject build date
        run: |
          sed -i "s/{{date}}/$(date +'%d.%m.%Y')/g" docs/ru/_pdf/cover.md docs/en/_pdf/cover.md

      - name: Build docs (HTML)
        uses: diplodoc-platform/docs-build-static-action@v1
        with:
          src-root: './docs'
          build-root: './docs-html'

      # ========== НОВОЕ: собираем PDF и кладём в папку сайта ==========
      - name: Setup Node for PDF
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and generate PDF
        run: |
          npm install @diplodoc/cli @diplodoc/pdf-generator
          npx yfm build -i ./docs -o ./docs-pdf
          npx @diplodoc/pdf-generator -i ./docs-pdf
          cp docs-pdf/ru/single-page.pdf docs-html/ru/single-page.pdf
          cp docs-pdf/en/single-page.pdf docs-html/en/single-page.pdf

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs-html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4