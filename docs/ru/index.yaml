blocks:
  - type: header-block
    title: Инструкция пользователя QR-Passport
    description: |
      Цифровой паспорт вашей продукции
    buttons:
      - text: 'Войти'
        size: 'promo'
        url: 'https://app.qrpassport.tech/login'
      - text: 'Задать вопрос'
        theme: 'outlined'
        size: 'promo'
        url: 'https://www.qrpassport.tech/#:~:text=info%40qrpassport.tech'
    textWidth: 's'
    verticalOffset: 's'
    background:
      light:
        image:
          mobile: './_images/logo.png'
          desktop: './_images/logo.png'
          disableCompress: true
        
        fullWidth: false
      dark:
        image:
          mobile: './_images/logo_dark.png'
          desktop: './_images/logo_dark.png'
          disableCompress: true
       
        fullWidth: false

  - type: card-layout-block
    colSizes:
