      xl: 6
      sm: 6
      md: 6
    children:
      - type: basic-card
        title:
          text: О приложении
          textSize: s
        text: |
          [Начало работы](about.md)

          [Быстрый старт](quick_start.md)

          [История изменений](updates.md)

          [Часто задаваемые вопросы](FAQ.md)

      - type: basic-card
        title:
          text: Оборудование
          textSize: s
        text: |
          [Марки материалов](equipment/material_grades/about.md)

          [Сертификаты](equipment/certificates/about.md)

          [Модели](equipment/models/about.md)

          [Детали](equipment/details/about.md)

          [Зарегистрированные изделия](equipment/registered_products/about.md)

      - type: basic-card
        title:
          text: Организация
          textSize: s
        text: |
          [Управление доступом](organization/access_management.md)

      - type: basic-card
        title:
          text: Личный кабинет
          textSize: s
        text: |
          [О разделе](account/personal_account.md)

  - type: content-layout-block
    size: s

animated: true